<!-- Supabase dashboard: Authentication → Email templates → Invite user -->
<!-- Subject: You're invited to Atmosphere Scope -->
<!DOCTYPE html>
<html lang="en">
<body style="margin:0;padding:0;background:#f4f1eb;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f1eb;margin:0;padding:0;">
    <tr>
      <td align="center" style="padding:32px 16px;">
        <table role="presentation" width="560" cellpadding="0" cellspacing="0" style="width:100%;max-width:560px;background:#ffffff;border:1px solid #e3ded4;">
          <tr>
            <td style="padding:28px 32px 4px;">
              <img src="{{ .SiteURL }}/brand/lockup-on-light.png" alt="Atmosphere Scope" width="220" style="display:block;width:220px;max-width:100%;height:auto;border:0;">
            </td>
          </tr>
          <tr>
            <td style="padding:12px 32px 28px;font-family:Arial,Helvetica,sans-serif;color:#1c1917;font-size:16px;line-height:1.5;">
              <p style="margin:0 0 16px;">You're invited to an Atmosphere Scope company. Accept the invite and choose a password.</p>
              <table role="presentation" cellpadding="0" cellspacing="0">
                <tr>
                  <td bgcolor="#f5c518" style="background:#f5c518;border-radius:8px;">
                    <a href="{{ .SiteURL }}/auth/callback?token_hash={{ .TokenHash }}&amp;type=invite&amp;next=/auth/reset" style="display:inline-block;background:#f5c518;color:#18191b;text-decoration:none;font-weight:700;font-family:Arial,Helvetica,sans-serif;font-size:16px;line-height:20px;padding:12px 18px;border-radius:8px;">Accept invite</a>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td style="padding:14px 32px 22px;border-top:1px solid #e3ded4;font-family:Arial,Helvetica,sans-serif;font-size:12px;line-height:1.4;color:#57534e;">Atmosphere Scope</td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
