<!-- Supabase dashboard: Authentication, Email templates, Confirm signup -->
<!-- Subject: Confirm your Atmosphere Scope account -->
<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light only"><meta name="supported-color-schemes" content="light"></head>
<body style="margin:0;padding:0;background:#f4f1eb;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f1eb;">
    <tr>
      <td align="center" style="padding:48px 16px;">
        <table role="presentation" width="520" cellpadding="0" cellspacing="0" style="width:100%;max-width:520px;">
          <tr>
            <td style="padding:0 4px 24px;">
              <img src="{{ .SiteURL }}/brand/email-lockup.png" alt="Atmosphere Scope" width="176" height="31" style="display:block;width:176px;height:auto;border:0;">
            </td>
          </tr>
          <tr>
            <td style="background:#ffffff;border:1px solid #e6e1d7;border-top:3px solid #f5c518;padding:40px 40px 36px;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;">
              <h1 style="margin:0 0 14px;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:22px;line-height:1.3;font-weight:600;color:#18191b;letter-spacing:-0.2px;">Confirm your email</h1>
              <p style="margin:0 0 28px;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:15px;line-height:1.6;color:#44403c;">Welcome to Atmosphere Scope. Confirm your email address to finish setting up your company account.</p>
              <table role="presentation" cellpadding="0" cellspacing="0">
                <tr>
                  <td bgcolor="#f5c518" style="background:#f5c518;border-radius:6px;">
                    <a href="{{ if .RedirectTo }}{{ .RedirectTo }}&amp;token_hash={{ .TokenHash }}&amp;type=signup{{ else }}{{ .SiteURL }}/auth/callback?token_hash={{ .TokenHash }}&amp;type=signup&amp;next=/onboarding{{ end }}" style="display:inline-block;padding:13px 28px;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:15px;line-height:20px;font-weight:600;color:#18191b;text-decoration:none;border-radius:6px;">Confirm email</a>
                  </td>
                </tr>
              </table>
              <p style="margin:32px 0 0;padding-top:20px;border-top:1px solid #efebe3;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:13px;line-height:1.55;color:#78716c;">If you didn't create an account, you can ignore this email.</p>
            </td>
          </tr>
          <tr>
            <td style="padding:20px 4px 0;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:12px;line-height:1.5;color:#a8a29e;">Atmosphere Scope. Property damage assessment and estimating.</td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
